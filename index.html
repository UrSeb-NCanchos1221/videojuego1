<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Shooter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            color: #eee;
            font-family: 'Roboto Mono', monospace;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud-text {
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            color: #fff;
        }

        #health-bar-container {
            width: 200px;
            height: 20px;
            background-color: rgba(255, 0, 0, 0.3);
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        #health-bar-fill {
            width: 100%;
            height: 100%;
            background-color: #ff3333;
            transition: width 0.2s ease-out, background-color 0.2s ease-out;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-family: 'Creepster', cursive;
            font-size: 5rem;
            color: #22c55e;
            text-shadow: 0 0 10px #22c55e, 0 0 20px #22c55e;
            margin-bottom: 20px;
            text-align: center;
        }

        .overlay h2 {
            font-size: 3rem;
            color: #ef4444;
            margin-bottom: 10px;
        }

        .overlay p {
            font-size: 1.5rem;
            margin-bottom: 30px;
            text-align: center;
            max-width: 80%;
        }

        .btn {
            background-color: #4b5563;
            color: white;
            border: 2px solid #9ca3af;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-family: inherit;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        .btn:hover {
            background-color: #6b7280;
            transform: scale(1.05);
            border-color: #fff;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #mobile-controls {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            pointer-events: auto;
            z-index: 5;
        }

        .joystick-zone {
            width: 150px;
            height: 150px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }

        .joystick-knob {
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #shoot-btn {
            width: 100px;
            height: 100px;
            background-color: rgba(239, 68, 68, 0.5);
            border: 2px solid rgba(239, 68, 68, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            user-select: none;
            touch-action: none;
        }
        
        #shoot-btn:active {
            background-color: rgba(239, 68, 68, 0.8);
        }

        @media (max-width: 768px) {
            h1 { font-size: 3.5rem; }
            .overlay h2 { font-size: 2.5rem; }
            .btn { font-size: 1.2rem; padding: 10px 20px; }
            .hud-text { font-size: 1.2rem; }
            #health-bar-container { width: 150px; }
        }
    </style>
</head>
<body>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer">
        <div class="top-bar flex justify-between items-start w-full">
            <div>
                <div id="scoreDisplay" class="hud-text">Score: 0</div>
                <div id="waveDisplay" class="hud-text text-yellow-400 mt-1">Wave: 1</div>
            </div>
            <div class="text-right">
                <div class="hud-text">Salud</div>
                <div id="health-bar-container">
                    <div id="health-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
        <div id="movement-joystick" class="joystick-zone">
            <div id="movement-knob" class="joystick-knob"></div>
        </div>
        <div id="shoot-btn">FIRE</div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="overlay">
        <h1>ZOMBIE<br>SURVIVAL</h1>
        <p>Sobrevive a las hordas. Muévete con WASD/Flechas. Dispara con el Ratón.</p>
        <button id="startBtn" class="btn">Empezar a Jugar</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="overlay hidden">
        <h2>HAS MUERTO</h2>
        <p id="finalScore" class="text-2xl font-bold mb-2">Puntuación Final: 0</p>
        <p id="finalWave" class="text-xl text-yellow-400 mb-6">Oleada Alcanzada: 1</p>
        <button id="restartBtn" class="btn">Jugar de Nuevo</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const waveDisplay = document.getElementById('waveDisplay');
        const healthBarFill = document.getElementById('health-bar-fill');
        const finalScore = document.getElementById('finalScore');
        const finalWave = document.getElementById('finalWave');
        const mobileControls = document.getElementById('mobile-controls');
        const movementJoystick = document.getElementById('movement-joystick');
        const movementKnob = document.getElementById('movement-knob');
        const shootBtn = document.getElementById('shoot-btn');

        // Game State
        let animationId;
        let isGameRunning = false;
        let score = 0;
        let wave = 1;
        let frameCount = 0;
        let isMobile = false;

        // Resize canvas to fill window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (isGameRunning && player) {
                player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
                player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 15;
                this.color = '#3b82f6';
                this.speed = 5;
                this.maxHealth = 100;
                this.health = this.maxHealth;
                this.angle = 0;
                this.dx = 0;
                this.dy = 0;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Body
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#1e3a8a';
                ctx.stroke();

                // Gun
                ctx.beginPath();
                ctx.moveTo(0, -5);
                ctx.lineTo(25, -5);
                ctx.lineTo(25, 5);
                ctx.lineTo(0, 5);
                ctx.fillStyle = '#9ca3af';
                ctx.fill();
                ctx.stroke();
                
                ctx.restore();
            }

            update() {
                let moveX = this.dx;
                let moveY = this.dy;

                if (moveX !== 0 && moveY !== 0) {
                    const length = Math.sqrt(moveX * moveX + moveY * moveY);
                    moveX = (moveX / length) * this.speed;
                    moveY = (moveY / length) * this.speed;
                } else {
                    moveX *= this.speed;
                    moveY *= this.speed;
                }

                this.x += moveX;
                this.y += moveY;

                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

                if (!isMobile && mouse.x !== undefined && mouse.y !== undefined) {
                    this.angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
                }

                this.draw();
            }

            takeDamage(amount) {
                this.health -= amount;
                updateHealthUI();
                
                this.color = '#ef4444';
                setTimeout(() => { this.color = '#3b82f6'; }, 100);

                if (this.health <= 0) {
                    endGame();
                }
            }
        }

        class Projectile {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.radius = 4;
                this.color = '#fbbf24';
                this.speed = 15;
                this.velocity = {
                    x: Math.cos(angle) * this.speed,
                    y: Math.sin(angle) * this.speed
                };
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.draw();
            }
        }

        class Zombie {
            constructor(x, y, type = 'normal') {
                this.x = x;
                this.y = y;
                this.type = type;
                
                if (type === 'fast') {
                    this.radius = 12;
                    this.color = '#84cc16'; // Lighter green
                    this.baseSpeed = 2.5 + (wave * 0.1);
                    this.health = 1;
                    this.damage = 5;
                    this.scoreValue = 15;
                } else if (type === 'tank') {
                    this.radius = 25;
                    this.color = '#14532d'; // Dark green
                    this.baseSpeed = 0.8 + (wave * 0.05);
                    this.health = 5 + Math.floor(wave / 3);
                    this.damage = 25;
                    this.scoreValue = 30;
                } else if (type === 'exploder') {
                    this.radius = 18;
                    this.color = '#ef4444'; // Bright Red
                    this.baseSpeed = 1.6 + (wave * 0.08);
                    this.health = 2;
                    this.damage = 0; // El daño se aplica por explosión
                    this.scoreValue = 25;
                } else if (type === 'spitter') {
                    this.radius = 16;
                    this.color = '#9333ea'; // Purple
                    this.baseSpeed = 1.3 + (wave * 0.06);
                    this.health = 2;
                    this.damage = 10;
                    this.scoreValue = 20;
                    this.lastShot = Date.now() + Math.random() * 2000;
                } else {
                    this.radius = 15;
                    this.color = '#22c55e'; // Standard green
                    this.baseSpeed = 1.2 + (wave * 0.1);
                    this.health = 2;
                    this.damage = 10;
                    this.scoreValue = 10;
                }
                
                this.speed = this.baseSpeed;
                this.angle = 0;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#064e3b';
                ctx.stroke();

                ctx.fillStyle = this.color;
                ctx.strokeStyle = '#064e3b';
                
                ctx.beginPath();
                ctx.arc(this.radius * 0.8, -this.radius * 0.6, this.radius * 0.4, 0, Math.PI*2);
                ctx.fill(); ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(this.radius * 0.8, this.radius * 0.6, this.radius * 0.4, 0, Math.PI*2);
                ctx.fill(); ctx.stroke();

                ctx.restore();
            }

            update() {
                this.angle = Math.atan2(player.y - this.y, player.x - this.x);
                
                // Comportamientos especiales
                if (this.type === 'exploder') {
                    const dist = Math.hypot(player.x - this.x, player.y - this.y);
                    if (dist < 60) {
                        this.health = 0; // Detonar
                    }
                } else if (this.type === 'spitter') {
                    const dist = Math.hypot(player.x - this.x, player.y - this.y);
                    if (dist < 300) {
                        this.speed = this.baseSpeed * 0.1; 
                        if (Date.now() - this.lastShot > 3000) {
                            spitProjectiles.push(new SpitProjectile(this.x, this.y, player.x, player.y));
                            this.lastShot = Date.now();
                        }
                    } else {
                        this.speed = this.baseSpeed;
                    }
                }

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                this.draw();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 3 + 1;
                this.color = color;
                this.velocity = {
                    x: (Math.random() - 0.5) * (Math.random() * 6),
                    y: (Math.random() - 0.5) * (Math.random() * 6)
                };
                this.alpha = 1;
                this.friction = 0.98;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.02;
                this.draw();
            }
        }

        class Explosion {
            constructor(x, y, radius) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.currentRadius = 0;
                this.alpha = 0.8;
            }
            update() {
                this.currentRadius += (this.radius - this.currentRadius) * 0.2;
                this.alpha -= 0.03;
                this.draw();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.currentRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#ef4444'; // Bright Red
                ctx.fill();
                ctx.restore();
            }
        }

        class SpitProjectile {
            constructor(startX, startY, targetX, targetY) {
                this.x = startX;
                this.y = startY;
                this.speed = 5;
                this.radius = 6;
                this.color = '#9333ea'; // Purple
                
                const angle = Math.atan2(targetY - startY, targetX - startX);
                this.velocity = {
                    x: Math.cos(angle) * this.speed,
                    y: Math.sin(angle) * this.speed
                };
                
                this.distanceTraveled = 0;
                this.totalDistance = Math.hypot(targetX - startX, targetY - startY);
            }
            
            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.distanceTraveled += this.speed;
                this.draw();
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            
            hasLanded() {
                return this.distanceTraveled >= this.totalDistance;
            }
        }

        class Puddle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 45;
                this.createdAt = Date.now();
                this.lifespan = 6000; // 6 seconds
            }
            
            isExpired() {
                return Date.now() - this.createdAt > this.lifespan;
            }
            
            draw() {
                ctx.save();
                const age = Date.now() - this.createdAt;
                let alpha = 0.5;
                if (age > this.lifespan - 1000) {
                    alpha = 0.5 * (this.lifespan - age) / 1000;
                }
                ctx.globalAlpha = Math.max(0, alpha);
                ctx.beginPath();
                // Draw splat shape approximation
                ctx.ellipse(this.x, this.y, this.radius, this.radius * 0.7, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#9333ea';
                ctx.fill();
                ctx.restore();
            }
        }

        let player;
        let projectiles = [];
        let zombies = [];
        let particles = [];
        let explosions = [];
        let puddles = [];
        let spitProjectiles = [];
        
        const keys = {
            w: false, a: false, s: false, d: false,
            ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false
        };
        const mouse = { x: undefined, y: undefined, isDown: false };
        
        let lastShotTime = 0;
        const fireRate = 150;
        let autoShootInterval;

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) {
                keys[e.key] = true;
                updatePlayerMovement();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) {
                keys[e.key] = false;
                updatePlayerMovement();
            }
        });

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mousedown', (e) => {
            if (!isGameRunning || e.target.closest('.overlay')) return;
            mouse.isDown = true;
            shoot();
            autoShootInterval = setInterval(shoot, fireRate);
        });

        window.addEventListener('mouseup', () => {
            mouse.isDown = false;
            clearInterval(autoShootInterval);
        });
        
        window.addEventListener('touchstart', function detectTouch() {
            isMobile = true;
            mobileControls.style.display = 'flex';
            window.removeEventListener('touchstart', detectTouch);
        });

        let joystickCenter = { x: 0, y: 0 };
        let joystickActive = false;
        let joystickMaxDist = 45; 

        movementJoystick.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = movementJoystick.getBoundingClientRect();
            joystickCenter = {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
            joystickActive = true;
            handleJoystickMove(e.touches[0]);
        });

        movementJoystick.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (joystickActive) {
                handleJoystickMove(e.touches[0]);
            }
        });

        const resetJoystick = () => {
            joystickActive = false;
            movementKnob.style.transform = `translate(-50%, -50%)`;
            if (player) {
                player.dx = 0;
                player.dy = 0;
            }
        };

        movementJoystick.addEventListener('touchend', resetJoystick);
        movementJoystick.addEventListener('touchcancel', resetJoystick);

        function handleJoystickMove(touch) {
            const touchX = touch.clientX;
            const touchY = touch.clientY;
            
            let dx = touchX - joystickCenter.x;
            let dy = touchY - joystickCenter.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance > joystickMaxDist) {
                dx = (dx / distance) * joystickMaxDist;
                dy = (dy / distance) * joystickMaxDist;
            }
            
            movementKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            
            if (player) {
                const normalizedX = dx / joystickMaxDist;
                const normalizedY = dy / joystickMaxDist;
                
                player.dx = normalizedX;
                player.dy = normalizedY;
                
                if (!mouse.isDown) {
                     player.angle = Math.atan2(normalizedY, normalizedX);
                }
            }
        }

        let mobileShootInterval;
        shootBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!isGameRunning) return;
            mouse.isDown = true;
            shoot();
            mobileShootInterval = setInterval(shoot, fireRate);
        });

        const stopMobileShoot = (e) => {
            if(e) e.preventDefault();
            mouse.isDown = false;
            clearInterval(mobileShootInterval);
        };
        shootBtn.addEventListener('touchend', stopMobileShoot);
        shootBtn.addEventListener('touchcancel', stopMobileShoot);

        function updatePlayerMovement() {
            if (!player || isMobile) return;

            player.dx = 0;
            player.dy = 0;

            if (keys.w || keys.ArrowUp) player.dy = -1;
            if (keys.s || keys.ArrowDown) player.dy = 1;
            if (keys.a || keys.ArrowLeft) player.dx = -1;
            if (keys.d || keys.ArrowRight) player.dx = 1;
        }

        function shoot() {
            if (!isGameRunning || !player) return;
            
            const now = Date.now();
            if (now - lastShotTime < fireRate) return;
            
            const muzzleDist = 25;
            const muzzleX = player.x + Math.cos(player.angle) * muzzleDist;
            const muzzleY = player.y + Math.sin(player.angle) * muzzleDist;

            projectiles.push(new Projectile(muzzleX, muzzleY, player.angle));
            lastShotTime = now;
            
            player.x -= Math.cos(player.angle) * 2;
            player.y -= Math.sin(player.angle) * 2;
        }

        function spawnZombie() {
            let x, y;
            const spawnMargin = 50;
            
            if (Math.random() < 0.5) {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? -spawnMargin : canvas.height + spawnMargin;
            } else {
                x = Math.random() < 0.5 ? -spawnMargin : canvas.width + spawnMargin;
                y = Math.random() * canvas.height;
            }

            let type = 'normal';
            const rand = Math.random();
            if (wave > 4 && rand > 0.85) {
                type = 'spitter';
            } else if (wave > 3 && rand > 0.70) {
                type = 'exploder';
            } else if (wave > 4 && rand > 0.55) {
                type = 'tank';
            } else if (wave > 2 && rand > 0.35) {
                type = 'fast';
            }

            zombies.push(new Zombie(x, y, type));
        }

        function createParticles(x, y, color, amount) {
            for (let i = 0; i < amount; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function createExplosion(x, y) {
            const radius = 120;
            const maxDamage = 40;
            explosions.push(new Explosion(x, y, radius));
            
            const distP = Math.hypot(player.x - x, player.y - y);
            if (distP < radius + player.radius) {
                const damage = maxDamage * (1 - (distP / radius));
                player.takeDamage(damage);
            }
            
            zombies.forEach(z => {
                const distZ = Math.hypot(z.x - x, z.y - y);
                if (distZ < radius + z.radius) {
                    z.health -= 50; 
                }
            });
        }

        function updateUI() {
            scoreDisplay.innerText = `Score: ${score}`;
            waveDisplay.innerText = `Wave: ${wave}`;
        }

        function updateHealthUI() {
            if (!player) return;
            const percentage = Math.max(0, (player.health / player.maxHealth) * 100);
            healthBarFill.style.width = `${percentage}%`;
            
            if (percentage > 50) {
                healthBarFill.style.backgroundColor = '#22c55e';
            } else if (percentage > 20) {
                healthBarFill.style.backgroundColor = '#eab308';
            } else {
                healthBarFill.style.backgroundColor = '#ef4444';
            }
        }

        function animate() {
            if (!isGameRunning) return;
            
            animationId = requestAnimationFrame(animate);

            ctx.fillStyle = 'rgba(26, 26, 26, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            ctx.beginPath();
            for(let x = 0; x <= canvas.width; x += gridSize) {
                ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
            }
            for(let y = 0; y <= canvas.height; y += gridSize) {
                ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();

            // Handle Puddles
            let playerInPuddle = false;
            for (let i = puddles.length - 1; i >= 0; i--) {
                const puddle = puddles[i];
                if (puddle.isExpired()) {
                    puddles.splice(i, 1);
                } else {
                    puddle.draw();
                    if (Math.hypot(player.x - puddle.x, player.y - puddle.y) < puddle.radius + player.radius) {
                        playerInPuddle = true;
                    }
                }
            }

            if (playerInPuddle && frameCount % 15 === 0) {
                player.takeDamage(3);
            }

            player.update();

            // Handle Explosions
            for (let i = explosions.length - 1; i >= 0; i--) {
                const exp = explosions[i];
                if (exp.alpha <= 0) {
                    explosions.splice(i, 1);
                } else {
                    exp.update();
                }
            }

            // Handle Spit Projectiles
            for (let i = spitProjectiles.length - 1; i >= 0; i--) {
                const spit = spitProjectiles[i];
                spit.update();
                if (spit.hasLanded()) {
                    puddles.push(new Puddle(spit.x, spit.y));
                    spitProjectiles.splice(i, 1);
                }
            }

            // Handle Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                if (particle.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    particle.update();
                }
            }

            // Handle Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const projectile = projectiles[i];
                projectile.update();

                if (projectile.x < 0 || projectile.x > canvas.width || 
                    projectile.y < 0 || projectile.y > canvas.height) {
                    projectiles.splice(i, 1);
                }
            }

            const spawnRate = Math.max(20, 100 - (wave * 5)); 
            if (frameCount % Math.floor(spawnRate) === 0) {
                spawnZombie();
            }

            const nextWaveScore = wave * wave * 500;
            if (score >= nextWaveScore) {
                wave++;
                updateUI();
                player.health = Math.min(player.maxHealth, player.health + 20);
                updateHealthUI();
                
                const wText = document.createElement('div');
                wText.textContent = `WAVE ${wave}`;
                wText.className = 'absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-6xl text-yellow-400 font-bold opacity-0 transition-opacity duration-1000 pointer-events-none z-10';
                wText.style.fontFamily = "'Creepster', cursive";
                document.body.appendChild(wText);
                
                setTimeout(() => wText.style.opacity = '1', 50);
                setTimeout(() => {
                    wText.style.opacity = '0';
                    setTimeout(() => wText.remove(), 1000);
                }, 2000);
            }

            // Handle Zombies
            for (let i = zombies.length - 1; i >= 0; i--) {
                const zombie = zombies[i];
                zombie.update();

                if (zombie.health <= 0) {
                    if (zombie.type === 'exploder') {
                        createExplosion(zombie.x, zombie.y);
                    }
                    createParticles(zombie.x, zombie.y, zombie.color, 15);
                    score += zombie.scoreValue;
                    updateUI();
                    zombies.splice(i, 1);
                    continue; 
                }

                const distPlayer = Math.hypot(player.x - zombie.x, player.y - zombie.y);
                if (distPlayer - zombie.radius - player.radius < 0) {
                    player.takeDamage(zombie.damage);
                    createParticles(player.x, player.y, '#ef4444', 10);
                    
                    player.x -= Math.cos(zombie.angle) * 10;
                    player.y -= Math.sin(zombie.angle) * 10;
                    
                    if (zombie.type === 'exploder') {
                        createExplosion(zombie.x, zombie.y);
                    }
                    
                    zombies.splice(i, 1);
                    continue; 
                }

                for (let j = projectiles.length - 1; j >= 0; j--) {
                    const projectile = projectiles[j];
                    const distProj = Math.hypot(projectile.x - zombie.x, projectile.y - zombie.y);

                    if (distProj - zombie.radius - projectile.radius < 0) {
                        createParticles(projectile.x, projectile.y, zombie.color, 5); 
                        projectiles.splice(j, 1); 
                        zombie.health -= 1;

                        if (zombie.health > 0) {
                            zombie.x -= Math.cos(zombie.angle) * 5;
                            zombie.y -= Math.sin(zombie.angle) * 5;
                        }
                        break; 
                    }
                }
            }

            frameCount++;
        }

        function initGame() {
            player = new Player(canvas.width / 2, canvas.height / 2);
            projectiles = [];
            zombies = [];
            particles = [];
            explosions = [];
            puddles = [];
            spitProjectiles = [];
            
            score = 0;
            wave = 1;
            frameCount = 0;
            
            for(let key in keys) keys[key] = false;
            resetJoystick();
            clearInterval(autoShootInterval);
            clearInterval(mobileShootInterval);
            mouse.isDown = false;

            updateUI();
            updateHealthUI();
        }

        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            initGame();
            
            isGameRunning = true;
            animate();
        }

        function endGame() {
            isGameRunning = false;
            cancelAnimationFrame(animationId);
            
            clearInterval(autoShootInterval);
            clearInterval(mobileShootInterval);
            
            finalScore.innerText = `Puntuación Final: ${score}`;
            finalWave.innerText = `Oleada Alcanzada: ${wave}`;
            gameOverScreen.classList.remove('hidden');
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

    </script>
</body>
</html>
